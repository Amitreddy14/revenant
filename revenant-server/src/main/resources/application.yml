spring:
  application:
    name: revenant-server
  datasource:
    # Defaults match docker-compose.yml. Override with environment variables in other environments.
    url: ${REVENANT_DB_URL:jdbc:postgresql://localhost:5432/revenant}
    username: ${REVENANT_DB_USER:revenant}
    password: ${REVENANT_DB_PASSWORD:revenant}

revenant:
  scheduler:
    # Fires due timers and fails attempts that outlived their timeout (ADR-0010).
    enabled: true
    interval: PT1S
    batch-size: 100
  kafka:
    # Set enabled: false to run without Kafka; events then wait in the outbox (ADR-0005).
    enabled: true
    bootstrap-servers: ${REVENANT_KAFKA_BOOTSTRAP:localhost:9092}
    topic: revenant.workflow-events
  relay:
    interval: PT0.5S
    batch-size: 100
  redis:
    # Task wake-up hints between server instances. Only an accelerator: with Redis off or
    # unreachable, workers poll PostgreSQL and nothing is lost (ADR-0004, ADR-0012).
    enabled: true
    url: ${REVENANT_REDIS_URL:redis://localhost:6379}

  security:
    # API key authentication for /api/* (ADR-0014). Comma-separated keys, each 16+ characters.
    # Empty = the API is open (local development). Set required: true on any exposed server.
    api-keys: ${REVENANT_API_KEYS:}
    required: ${REVENANT_SECURITY_REQUIRED:false}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
