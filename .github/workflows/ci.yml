name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Commits made from Windows can lose the executable bit on gradlew.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate the production compose file
        env:
          POSTGRES_PASSWORD: ci-only
          REVENANT_API_KEY: ci-only-key-0123456789
          REVENANT_DOMAIN: ci.example.com
        run: docker compose -f deploy/docker-compose.prod.yml --profile demo --profile kafka config --quiet
      - name: Check the shell script syntax
        run: bash -n scripts/demo-kill-worker.sh

  images:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build --target server -t revenant-server .
      - name: Build the demo worker image
        run: docker build --target demo-worker -t revenant-demo-worker .
