# Local development infrastructure for Revenant: PostgreSQL, Redis, Kafka.
#
#   docker compose up -d       start everything
#   docker compose ps          check health (wait for "healthy")
#   docker compose down        stop (data kept)
#   docker compose down -v     stop and DELETE all data
#
# Passwords below are for local development only. Override them via a .env file
# (copy .env.example). Never reuse them anywhere real.

name: revenant

services:
  postgres:
    image: postgres:17-alpine
    container_name: revenant-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-revenant}
      POSTGRES_USER: ${POSTGRES_USER:-revenant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revenant}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: revenant-redis
    # noeviction: Redis must never silently drop lease/queue keys under memory pressure.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    container_name: revenant-kafka
    # Single-node KRaft (no ZooKeeper). Data is intentionally ephemeral in dev:
    # PostgreSQL is the source of truth and the outbox re-publishes anything missing (ADR-0005).
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
